<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151515">
  <meta name="description" content="Préparation et validation des contenus réseaux sociaux TECHNIMAT">
  <title>TECHNIMAT Social Studio</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=3">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">T</div>
        <div><strong>TECHNIMAT</strong><span>STUDIO SOCIAL</span></div>
      </div>
      <nav id="desktopNav" aria-label="Navigation principale"></nav>
      <div class="sidebar-foot">
        <div class="sync-dot"></div>
        <div><strong>GitHub Pages</strong><span id="lastSyncSide">Synchronisation…</span></div>
      </div>
    </aside>

    <section class="content-shell">
      <header class="topbar">
        <div class="mobile-brand">
          <div class="brand compact">
            <div class="brand-mark" aria-hidden="true">T</div>
            <div><strong>TECHNIMAT</strong><span>STUDIO SOCIAL</span></div>
          </div>
        </div>
        <div class="network-switcher" aria-label="Réseau social actif">
          <button class="network active" type="button"><span class="network-dot instagram-dot">◎</span> Instagram</button>
          <button class="network desktop-only" type="button" data-coming="LinkedIn">in LinkedIn</button>
          <button class="network desktop-only" type="button" data-coming="Facebook">f Facebook</button>
        </div>
        <div class="topbar-title desktop-only">
          <strong>Vincent Leclerc</strong>
          <small>Gestionnaire de contenu</small>
        </div>
      </header>
      <div id="pageContent" class="page-wrap" aria-live="polite"></div>
    </section>

    <nav id="mobileNav" class="mobile-nav" aria-label="Navigation mobile"></nav>
    <button id="forceRefresh" class="force-refresh" type="button" aria-label="Forcer l’actualisation">↻</button>
    <div id="modalRoot"></div>
    <div id="toast" class="toast" hidden></div>
  </main>
  <script src="./app.js?v=3"></script>
</body>
</html>
