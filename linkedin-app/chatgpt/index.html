<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Tableau de bord LinkedIn de Vincent alimenté par ChatGPT">
  <title>Vincent LinkedIn · ChatGPT</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="visuals.css">
  <link rel="stylesheet" href="refresh.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="logo">VL</div><div><strong>Vincent LinkedIn</strong><span>Alimenté par ChatGPT</span></div></div>
      <nav id="nav"></nav>
      <div class="sync-card"><span class="dot"></span><div><strong>Synchronisation ChatGPT</strong><small id="lastSync">Chargement…</small></div></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><span class="eyebrow">COMMUNITY MANAGER PERSONNEL</span><h1 id="pageTitle">Tableau de bord</h1></div>
        <div class="top-actions"><button class="btn light" id="refreshBtn">Actualiser</button><button class="btn primary" data-route="proposals">Voir les idées</button></div>
      </header>
      <section id="app" class="content"></section>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>
  <dialog id="postDialog">
    <div class="dialog-head"><div><span class="eyebrow">PUBLICATION LINKEDIN</span><h2 id="dialogTitle"></h2></div><button class="icon-btn" id="closeDialog">×</button></div>
    <div id="dialogBody" class="dialog-body"></div>
    <div class="dialog-actions">
      <button class="btn light" id="copyPost">Copier le texte</button>
      <button class="btn light" id="uploadPhoto">Ajouter / remplacer ma photo</button>
      <button class="btn light" id="downloadVisual">Télécharger ma photo</button>
      <button class="btn success" id="sharePost">Partager texte + photo</button>
      <button class="btn light" id="validatePost">Valider</button>
      <button class="btn primary" id="publishPost">Ouvrir LinkedIn</button>
    </div>
  </dialog>
  <button class="hard-refresh-btn" id="hardRefreshBtn" type="button" title="Équivalent de Ctrl + F5" aria-label="Forcer l’actualisation complète du site">
    <span class="refresh-icon" aria-hidden="true">↻</span>
    <span class="refresh-label">Forcer l’actualisation</span>
  </button>
  <div class="toast" id="toast"></div>
  <script src="app.js" defer></script>
  <script>
    (()=>{
      const button=document.getElementById('hardRefreshBtn');
      if(!button)return;
      button.addEventListener('click',async()=>{
        button.disabled=true;
        button.classList.add('loading');
        const label=button.querySelector('.refresh-label');
        if(label)label.textContent='Actualisation…';
        try{
          if('caches' in window){
            const names=await caches.keys();
            await Promise.all(names.map(name=>caches.delete(name)));
          }
          if('serviceWorker' in navigator){
            const registrations=await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(registration=>registration.unregister()));
          }
          await fetch(location.pathname+'?cacheReload='+Date.now(),{cache:'reload',credentials:'same-origin'});
        }catch(error){}
        const next=new URL(window.location.href);
        next.searchParams.set('_refresh',Date.now().toString());
        window.location.replace(next.toString());
      });
    })();
  </script>
</body>
</html>
