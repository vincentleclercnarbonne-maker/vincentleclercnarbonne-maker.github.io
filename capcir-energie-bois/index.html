<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173d2b">
  <title>Capcir Énergie Bois</title>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>
<body>
  <div id="root">
    <p id="loading" style="font-family:Arial,sans-serif;padding:24px;color:#173d2b">Chargement de Capcir Énergie Bois…</p>
  </div>
  <script type="module">
    const loading = document.getElementById('loading');
    try {
      const getChunks = async (name, count) => {
        const parts = [];
        for (let i = 0; i < count; i++) {
          const response = await fetch(`./${name}.${i}.txt?v=2`, { cache: 'no-store' });
          if (!response.ok) throw new Error(`Fichier ${name}.${i}.txt introuvable`);
          parts.push(await response.text());
        }
        return parts.join('').replace(/\s/g, '');
      };

      const decodeGzipBase64 = (base64) => {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return window.pako.ungzip(bytes, { to: 'string' });
      };

      const cssBase64 = await getChunks('css', 2);
      const style = document.createElement('style');
      style.textContent = decodeGzipBase64(cssBase64);
      document.head.appendChild(style);

      const jsBase64 = await getChunks('app', 5);
      const js = decodeGzipBase64(jsBase64);
      const moduleUrl = URL.createObjectURL(new Blob([js], { type: 'text/javascript' }));
      await import(moduleUrl);
      URL.revokeObjectURL(moduleUrl);
    } catch (error) {
      console.error(error);
      document.getElementById('root').innerHTML = `
        <div style="font-family:Arial,sans-serif;padding:24px;max-width:520px;margin:auto">
          <h2 style="color:#173d2b">Impossible de charger l’application</h2>
          <p>Actualisez la page. Si le problème continue, fermez puis rouvrez Safari.</p>
          <button onclick="location.reload()" style="background:#173d2b;color:white;border:0;border-radius:10px;padding:12px 18px;font-size:16px">Réessayer</button>
          <p style="font-size:12px;color:#666;margin-top:20px">${String(error.message || error)}</p>
        </div>`;
    }
  </script>
</body>
</html>
