<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173d2b">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Capcir Énergie Bois</title>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f4ef;color:#173d2b;font-family:Arial,sans-serif}
    #loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .loader-card{max-width:560px}.spinner{width:46px;height:46px;border:5px solid #d9e2dc;border-top-color:#173d2b;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .retry{display:none;margin-top:18px;background:#173d2b;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer}
    #detail{font-size:12px;color:#667169;margin-top:12px;word-break:break-word}
  </style>
</head>
<body>
  <div id="root">
    <div id="loading"><div class="loader-card"><div class="spinner"></div><h2>Chargement de Capcir Énergie Bois</h2><p>Préparation de l’application…</p><button class="retry" id="retry">Réessayer</button><div id="detail"></div></div></div>
  </div>
  <script type="module">
    const detail = document.getElementById('detail');
    const retry = document.getElementById('retry');

    const overlapLength = (left, right) => {
      const max = Math.min(left.length, right.length);
      const suffix = left.slice(left.length - max);
      const combined = right + '#' + suffix;
      const prefix = new Array(combined.length).fill(0);
      for (let i = 1; i < combined.length; i++) {
        let j = prefix[i - 1];
        while (j > 0 && combined[i] !== combined[j]) j = prefix[j - 1];
        if (combined[i] === combined[j]) j++;
        prefix[i] = j;
      }
      return Math.min(prefix[prefix.length - 1], max);
    };

    const mergeParts = parts => {
      let result = parts[0] || '';
      for (let i = 1; i < parts.length; i++) {
        const overlap = overlapLength(result, parts[i]);
        result += parts[i].slice(overlap);
      }
      return result;
    };

    const readParts = async (name, count) => {
      const parts = [];
      for (let i = 0; i < count; i++) {
        const response = await fetch(`./${name}.${i}.txt?v=4`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`${name}.${i}.txt introuvable (${response.status})`);
        parts.push((await response.text()).replace(/\s+/g, ''));
      }
      return mergeParts(parts);
    };

    const decode = value => {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      if (bytes[0] !== 0x1f || bytes[1] !== 0x8b) throw new Error('En-tête gzip invalide après reconstruction');
      if (!window.pako) throw new Error('Le module de décompression n’a pas été chargé');
      return window.pako.ungzip(bytes, { to: 'string' });
    };

    const start = async () => {
      retry.style.display = 'none';
      detail.textContent = '';
      try {
        const css = decode(await readParts('css', 2));
        const style = document.createElement('style');
        style.textContent = css;
        document.head.appendChild(style);

        const javascript = decode(await readParts('app', 5));
        const moduleUrl = URL.createObjectURL(new Blob([javascript], { type: 'text/javascript' }));
        await import(moduleUrl);
        URL.revokeObjectURL(moduleUrl);
      } catch (error) {
        console.error(error);
        document.querySelector('.spinner').style.display = 'none';
        document.querySelector('#loading h2').textContent = 'Impossible de charger l’application';
        document.querySelector('#loading p').textContent = 'Actualisez la page. Si le problème continue, utilisez Chrome ou Edge puis réessayez.';
        detail.textContent = error instanceof Error ? error.message : String(error);
        retry.style.display = 'inline-flex';
      }
    };

    retry.addEventListener('click', () => location.reload());
    start();
  </script>
</body>
</html>
