<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d2b"><title>Capcir Énergie Bois</title></head><body><div id="root"><p style="font-family:Arial;padding:24px">Chargement de Capcir Énergie Bois…</p></div><script type="module">const get=async(n,c)=>(await Promise.all(Array.from({length:c},(_,i)=>fetch(`./${n}.${i}.txt`).then(r=>r.text())))).join('');const unzip=async b=>{const x=Uint8Array.from(atob(b),c=>c.charCodeAt(0));return await new Response(new Blob([x]).stream().pipeThrough(new DecompressionStream('gzip'))).text()};const s=document.createElement('style');s.textContent=await unzip(await get('css',2));document.head.appendChild(s);const js=await unzip(await get('app',5));await import(URL.createObjectURL(new Blob([js],{type:'text/javascript'})));</script></body></html>
